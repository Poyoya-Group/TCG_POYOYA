<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POYOYA TCG</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- FontAwesome & Style CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body style="background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 0;">

  <!-- ÉCRAN DE CONNEXION / CHARGEMENT (Caché direct pour éviter le blocage) -->
  <div id="auth-screen" class="hidden" style="position: fixed; inset: 0; background: #121212; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="text-align: center; max-width: 420px; width: 90%; padding: 2rem;">
      <h2 id="auth-title" style="margin-bottom: 0.5rem; color: #1a9fcb;">POYOYA TCG</h2>
      <p id="auth-subtitle" style="color: #9ca3af; font-size: 0.9rem; margin-bottom: 1.5rem;">Connexion en cours...</p>
      <div id="auth-actions" class="hidden" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </div>
  </div>

  <!-- APPLICATION PRINCIPALE -->
  <div id="app" style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">
    
    <!-- BARRE DE NAVIGATION SUPÉRIEURE -->
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: #1e1e1e; border-bottom: 1px solid #333;">
      <div style="display: flex; align-items: center; gap: 2rem;">
        <h2 id="tcg-brand-name" style="font-size: 1.2rem; font-weight: bold; color: #1a9fcb; margin: 0;">POYOYA TCG</h2>
        
        <nav class="nav-tabs" style="display: flex; gap: 0.5rem; align-items: center;">
          <button class="nav-tab active" data-tab="boosters"><i class="fa-solid fa-box-open"></i> Boosters</button>
          <button class="nav-tab" data-tab="catalogue"><i class="fa-solid fa-book"></i> Catalogue</button>
          <button class="nav-tab" data-tab="echanges" style="position: relative;">
            <i class="fa-solid fa-handshake"></i> Échanges
            <span id="trades-tab-badge" class="hidden" style="position: absolute; top: 4px; right: 4px; background: #ef4444; width: 8px; height: 8px; border-radius: 50%;"></span>
          </button>
          <button class="nav-tab" data-tab="encheres"><i class="fa-solid fa-gavel"></i> Enchères</button>
          <button class="nav-tab" data-tab="duels"><i class="fa-solid fa-shield-halved"></i> Duels</button>
          <button class="nav-tab" data-tab="classement"><i class="fa-solid fa-trophy"></i> Classement</button>
          
          <!-- Groupe Admin -->
          <span id="admin-nav-group" style="display: flex; gap: 0.5rem; margin-left: 1rem; padding-left: 1rem; border-left: 1px solid #333;">
            <button class="nav-tab" data-tab="editeur"><i class="fa-solid fa-pen-nib"></i> Éditeur de cartes</button>
            <button class="nav-tab" data-tab="parametres"><i class="fa-solid fa-gear"></i> Paramètres du TCG</button>
          </span>
        </nav>
      </div>

      <!-- PROFIL & SOLDE -->
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div style="background: #2a2a2a; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; gap: 5px;">
          <i class="fa-solid fa-coins" style="color: #eab308;"></i> 
          <span id="user-balance">0</span> <span id="currency-symbol">P</span>
        </div>

        <div id="user-profile-btn" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;" />
          <span id="user-name" style="font-size: 0.9rem; font-weight: 500;">Mat_x32</span>
        </div>
      </div>
    </header>

    <!-- CONTENEUR PRINCIPAL DES ONGLETS -->
    <main id="app-content" style="flex: 1; overflow-y: auto; padding: 1.5rem; background: #121212;">
    </main>

  </div>

  <!-- CONTAINER DES TOASTS DE NOTIFICATION -->
  <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
